<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Instacertify Quotation</title>
  <link rel="icon" type="image/png" href="/assets/instacertify/images/favicon-32.png"/>
  <link rel="apple-touch-icon" href="/assets/instacertify/images/apple-touch-icon.png"/>
  <link rel="stylesheet" href="/assets/instacertify/css/instacertify.css"/>
  <style>
    body.ic-portal-body {
      margin:0;
      background:
        radial-gradient(1200px 420px at 10% -10%, rgba(236,105,31,.12), transparent 60%),
        radial-gradient(900px 380px at 100% 0%, rgba(6,81,117,.10), transparent 55%),
        #f4f6f8;
      color:#1a2433;
      font-family:"Segoe UI",Aptos,system-ui,sans-serif;
    }
    .ic-portal-wrap { width:min(920px, calc(100% - 32px)); margin:28px auto 48px; }
    .ic-portal-letterhead {
      display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
      padding:14px 18px 12px; margin-bottom:14px;
      background:#fff; border:1px solid #e7dcd3; border-bottom:2px solid #EC691F;
      border-radius:14px 14px 0 0; box-shadow:0 8px 24px rgba(6,81,117,.06);
    }
    .ic-portal-letterhead img { max-height:48px; max-width:260px; }
    .ic-portal-letterhead-co { text-align:right; font-size:12px; line-height:1.45; color:#334155; }
    .ic-portal-letterhead-co .name { font-weight:700; color:#065175; font-size:13px; margin-bottom:2px; }
    .ic-portal-card {
      background:#fff; border:1px solid #e7dcd3; border-radius:0 0 16px 16px;
      box-shadow:0 14px 34px rgba(33,38,60,.07); padding:22px 26px 22px;
    }
    .ic-portal-card h2 {
      color:#065175; margin:0 0 10px; letter-spacing:-0.02em; font-size:1.55rem;
      padding-bottom:8px; border-bottom:1px solid #f0e4db;
    }
    .ic-portal-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; align-items:center; }
    .ic-portal-muted { color:#6c718a; font-size:0.92rem; }
    .ic-table-scroll { width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .ic-portal-table { width:100%; border-collapse:collapse; margin:8px 0 4px; font-size:0.95rem; min-width:560px; }
    .ic-portal-table th, .ic-portal-table td { border-bottom:1px solid #efe5dd; padding:10px 8px; text-align:left; vertical-align:top; }
    .ic-portal-table th { color:#065175; font-weight:700; font-size:0.78rem; letter-spacing:.03em; text-transform:uppercase; background:#FFF7F2; }
    .ic-portal-table td { font-variant-numeric:tabular-nums; }
    .ic-status-pill { display:inline-block; padding:3px 10px; border-radius:999px; background:#ebf3fe; color:#1b6ec2; font-size:0.85rem; font-weight:600; }
    .ic-status-pill.accepted { background:#e7f7ee; color:#1b7a45; }
    .ic-status-pill.rejected { background:#fdecea; color:#b42318; }
    .ic-status-pill.changes { background:#fff4e5; color:#b54708; }
    .ic-portal-prose { white-space:pre-wrap; line-height:1.55; margin:0; }
    .ic-portal-total {
      margin-top:14px; padding:14px 16px; border:1px solid #f0d8c8; border-radius:12px;
      background:linear-gradient(90deg,#FFF7F2,#fff); display:flex; justify-content:space-between;
      gap:12px; font-weight:700; color:#065175; font-size:1.05rem;
    }
    .ic-portal-section { margin-top:14px; padding-top:4px; }
    .ic-portal-section h4, .ic-portal-card h4 {
      margin:14px 0 8px; color:#065175; font-size:1rem; letter-spacing:-0.01em;
      padding:6px 10px; background:#FFF1E8; border-left:3px solid #EC691F; border-radius:0 8px 8px 0;
    }
    #msg { margin-top:12px; padding:10px 12px; border-radius:10px; display:none; }
    #msg.ok { display:block; background:#e7f7ee; color:#1b7a45; }
    #msg.err { display:block; background:#fdecea; color:#b42318; }
    .ic-btn { border-radius:10px; min-height:40px; padding:8px 14px; }
    @media (max-width: 1000px) {
      .ic-portal-wrap { width:100%; box-sizing:border-box; }
    }
    @media (max-width: 700px) {
      .ic-portal-wrap { width:100%; box-sizing:border-box; margin:12px auto 28px; }
      .ic-portal-letterhead { flex-direction:column; align-items:flex-start; }
      .ic-portal-letterhead-co { text-align:left; }
      .ic-portal-card { padding:16px 14px; border-radius:0 0 12px 12px; }
      .ic-portal-card h2 { font-size:1.3rem; }
      .ic-portal-actions .ic-btn, .ic-portal-actions a.ic-btn { flex:1 1 100%; text-align:center; }
    }
  </style>
</head>
<body class="ic-portal-body">
  <div class="ic-portal-wrap">
    <div class="ic-portal-letterhead">
      <img src="/assets/instacertify/images/instacertify_logo.png" alt="Instacertify"/>
      <div class="ic-portal-letterhead-co">
        <div class="name">Instacertify Labs Private Limited</div>
        <div>PK 01 Sector 63A Noida, Gautam Buddha Nagar</div>
        <div>contact@instacertify.com · www.instacertify.com</div>
      </div>
    </div>
    <div class="ic-portal-card" id="app">
      <h2>Your Quotation</h2>
      <div id="content">Loading…</div>
      <div id="msg"></div>
      <div class="ic-portal-actions" id="actions" style="display:none;">
        <p class="ic-portal-muted">Approve or ask to revise — and download the PDF. This page does not provide access to the Instacertify ERP desk.</p>
        <button class="ic-btn ic-btn-primary" id="btn-accept">Approve Quotation</button>
        <button class="ic-btn ic-btn-accent" id="btn-changes">Ask to Revise</button>
        <a class="ic-btn ic-btn-ghost" id="btn-download" href="#" target="_blank" rel="noopener">Download PDF</a>
      </div>
      <div id="remarks-box" style="display:none;margin-top:12px;">
        <label class="ic-portal-muted" id="remarks-label">Remarks</label>
        <textarea id="remarks" rows="4" style="width:100%;border-radius:10px;border:1px solid #cfe0ea;padding:10px;margin-top:6px;" placeholder="Enter remarks"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
          <button class="ic-btn ic-btn-accent" id="btn-submit-action">Submit</button>
          <button class="ic-btn ic-btn-ghost" id="btn-cancel-remarks">Cancel</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const token = {{ token|tojson }};
    const csrf = {{ csrf_token|tojson }};
    let pendingAction = null;

    function esc(v) {
      const d = document.createElement('div');
      d.textContent = v == null ? '' : String(v);
      return d.innerHTML;
    }
    function money(v, c) {
      const n = Number(v || 0);
      return n.toLocaleString(undefined, {maximumFractionDigits: 2}) + (c ? (' ' + c) : '');
    }
    function statusClass(s) {
      if (s === 'Accepted') return 'accepted';
      if (s === 'Rejected / Lost') return 'rejected';
      if (s === 'Changes Requested') return 'changes';
      return '';
    }
    function showMsg(text, ok) {
      const el = document.getElementById('msg');
      el.className = ok ? 'ok' : 'err';
      el.textContent = text;
    }
    function post(method, body) {
      return fetch('/api/method/' + method, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': csrf},
        body: JSON.stringify(body || {})
      }).then(async (r) => {
        const data = await r.json();
        if (data.exc || data._server_messages) {
          let msg = 'Something went wrong.';
          try {
            const sm = JSON.parse(data._server_messages || '[]');
            if (sm[0]) msg = JSON.parse(sm[0]).message || msg;
          } catch (e) {}
          throw new Error(msg);
        }
        return data.message;
      });
    }
    function openRemarks(action, label, placeholder) {
      pendingAction = action;
      document.getElementById('remarks-label').textContent = label;
      document.getElementById('remarks').placeholder = placeholder;
      document.getElementById('remarks').value = '';
      document.getElementById('remarks-box').style.display = 'block';
    }
    function costTable(rows, currency, showTotals) {
      if (!rows || !rows.length) return { html: '', total: 0 };
      let grand = 0;
      const body = rows.map(r => {
        const qty = Number(r.quantity || 1);
        const unit = Number(r.unit_price != null ? r.unit_price : r.amount || 0);
        const amount = Number(r.amount != null ? r.amount : (unit * qty));
        grand += amount;
        return '<tr><td>' + esc(r.particulars || '') +
          (r.description ? '<div class="ic-portal-muted">' + esc(r.description) + '</div>' : '') +
          (r.payment_destination ? '<div class="ic-portal-muted">' + esc(r.payment_destination) + '</div>' : '') +
          '</td><td>' + esc(money(unit, currency)) + '</td>' +
          '<td>' + esc(qty) + '</td>' +
          '<td><b>' + esc(money(amount, currency)) + '</b></td></tr>';
      }).join('');
      const totalRow = showTotals
        ? ('<tr><td colspan="3" style="text-align:right;font-weight:700;">Commercials Total</td>' +
          '<td><b>' + esc(money(grand, currency)) + '</b></td></tr>')
        : '';
      return {
        total: grand,
        html: '<h4>Commercials / Cost Breakdown</h4><div class="ic-table-scroll">' +
          '<table class="ic-portal-table"><thead><tr><th>Particulars</th><th>Unit Price</th><th>No. of Units</th><th>Total Charges</th></tr></thead><tbody>' +
          body + totalRow +
          '</tbody></table></div>'
      };
    }
    function testTable(rows, currency, showTotals) {
      if (!rows || !rows.length) return { html: '', total: 0 };
      let grand = 0;
      const body = rows.map(r => {
        const qty = Number(r.quantity || 1);
        const price = Number(r.price || 0);
        const amount = Number(r.amount != null ? r.amount : (price * qty));
        grand += amount;
        return '<tr>' +
          '<td>' + esc(r.test_name || '') + '</td>' +
          '<td>' + esc(r.applicable_standard || '') + '</td>' +
          '<td>' + esc(r.description || '') + '</td>' +
          '<td>' + esc(qty) + '</td>' +
          '<td>' + esc(money(price, currency)) + '</td>' +
          '<td><b>' + esc(money(amount, currency)) + '</b></td>' +
          '</tr>';
      }).join('');
      const totalRow = showTotals
        ? ('<tr><td colspan="5" style="text-align:right;font-weight:700;">Testing Total</td>' +
          '<td><b>' + esc(money(grand, currency)) + '</b></td></tr>')
        : '';
      return {
        total: grand,
        html: '<h4>Test Lines — Laboratory, Scope &amp; Charges</h4><div class="ic-table-scroll">' +
          '<table class="ic-portal-table"><thead><tr>' +
          '<th>Test Name</th><th>Standard</th><th>Description</th>' +
          '<th>No. of Samples</th><th>Price</th><th>Total Price</th>' +
          '</tr></thead><tbody>' + body + totalRow +
          '</tbody></table></div>'
      };
    }
    function paymentGstNote(currency) {
      const cur = currency || 'INR';
      let msg = 'GST @ 18% shall be charged additionally on the quoted charges, as applicable under Indian GST (CGST+SGST / IGST).';
      if (cur !== 'INR') {
        msg = 'Amounts are in ' + cur + '. GST @ 18% shall be charged additionally on the quoted charges, as applicable under Indian GST (CGST+SGST / IGST).';
      }
      return '<p style="margin-top:8px;"><b>' + esc(msg) + '</b></p>';
    }
    function load() {
      if (!token) {
        document.getElementById('content').innerHTML =
          'Invalid or missing quotation link. Ask Instacertify to Share with Customer again and use the new link.';
        return;
      }
      fetch('/api/method/instacertify.www.ic_quotation.get_quotation?token=' + encodeURIComponent(token))
        .then(r => r.json()).then(r => {
          if (r.exc || r._server_messages) {
            let msg = 'Unable to load quotation. The link may be invalid or expired — ask Instacertify to share again.';
            try {
              const sm = JSON.parse(r._server_messages || '[]');
              if (sm[0]) msg = JSON.parse(sm[0]).message || msg;
            } catch (e) {}
            document.getElementById('content').innerHTML = esc(msg);
            return;
          }
          const d = r.message;
          if (!d) { document.getElementById('content').innerHTML = 'Quotation not found.'; return; }
          const showTotals = d.ic_show_total != 0;
          const tests = testTable(d.test_items, d.currency, showTotals);
          const costs = costTable(d.cost_items, d.currency, showTotals);
          const combined = tests.total + costs.total;
          let commercials = tests.html + costs.html;
          if (showTotals && combined > 0) {
            commercials += '<div class="ic-portal-total"><span>Total</span><span>' +
              esc(money(combined, d.currency)) + '</span></div>';
          }
          const aboutText = d.ic_about_service || d.ic_scope_of_work || '';
          document.getElementById('content').innerHTML =
            (d.portal_notice ? ('<p class="ic-portal-muted">' + esc(d.portal_notice) + '</p>') : '') +
            '<p><b>' + esc(d.reference || d.customer_name || 'Quotation') + '</b> · Revision ' + esc(d.ic_revision_number || 0) +
            ' · <span class="ic-status-pill ' + statusClass(d.ic_workflow_status) + '">' + esc(d.ic_workflow_status || '') + '</span></p>' +
            '<p>Customer: <b>' + esc(d.customer_name || '') + '</b>' +
              ' · Currency: <b>' + esc(d.currency || 'INR') + '</b>' +
              ' <span class="ic-portal-muted">(all charges use this currency)</span></p>' +
            '<p>Service: <b>' + esc(d.ic_service_name || d.ic_quotation_type || '') + '</b></p>' +
            '<p class="ic-portal-muted">Date: ' + esc(d.transaction_date || '') +
              (d.valid_till ? (' · Valid till ' + esc(d.valid_till)) : '') +
              (d.ic_show_timelines != 0 && d.ic_estimated_timeline ? (' · Timeline: ' + esc(d.ic_estimated_timeline)) : '') + '</p>' +
            (d.ic_show_about != 0 && aboutText ? ('<div style="margin-top:10px;white-space:pre-wrap;">' + esc(aboutText) + '</div>') : '') +
            (d.ic_show_validity != 0
              ? ('<h4 style="color:#0D47A1;">Validity</h4>' +
                (d.ic_validity_text
                  ? ('<div style="white-space:pre-wrap;">' + esc(d.ic_validity_text) + '</div>')
                  : ('<p>This quotation is valid for ' + esc(d.ic_validity_days || 90) + ' days from the date of issuance unless otherwise specified.</p>')))
              : '') +
            (d.ic_show_sample_required != 0 && d.ic_sample_required ? ('<h4 style="color:#0D47A1;">Sample Required</h4><div style="white-space:pre-wrap;">' + esc(d.ic_sample_required) + '</div>') : '') +
            (d.ic_show_documents_required != 0 && d.ic_documents_required ? ('<h4 style="color:#0D47A1;">Documents Required</h4><div style="white-space:pre-wrap;">' + esc(d.ic_documents_required) + '</div>') : '') +
            (d.ic_show_deliverables != 0 && d.ic_deliverables ? ('<h4 style="color:#0D47A1;">Deliverables</h4><div style="white-space:pre-wrap;">' + esc(d.ic_deliverables) + '</div>') : '') +
            (d.ic_show_commercials != 0 ? ('<h4 style="color:#0D47A1;margin-bottom:4px;">Commercials (' + esc(d.currency || 'INR') + ')</h4>' +
            (commercials || '<p class="ic-portal-muted">No commercial lines yet.</p>')) : '') +
            (d.ic_show_payment_terms != 0
              ? ('<div class="ic-portal-section"><h4>Payment Terms</h4>' +
                (d.ic_payment_terms
                  ? ('<div class="ic-portal-prose">' + esc(d.ic_payment_terms) + '</div>')
                  : '<p class="ic-portal-muted">As agreed with Instacertify.</p>') +
                (d.show_gst_note != 0 ? paymentGstNote(d.currency) : '') +
                '</div>')
              : '') +
            (d.ic_customer_remarks ? ('<p class="ic-portal-muted"><b>Your earlier remarks:</b> ' + esc(d.ic_customer_remarks) + '</p>') : '');
          document.getElementById('btn-download').href = d.pdf_url || ('/api/method/instacertify.quotation.events.download_quotation_pdf?token=' + encodeURIComponent(token));
          const show = !!d.can_decide;
          document.getElementById('actions').style.display = 'flex';
          document.getElementById('btn-accept').style.display = show ? '' : 'none';
          document.getElementById('btn-changes').style.display = show ? '' : 'none';
          document.getElementById('remarks-box').style.display = 'none';
        }).catch(() => {
          document.getElementById('content').innerHTML = 'Unable to load quotation.';
        });
    }
    document.getElementById('btn-accept').onclick = function () {
      openRemarks('accept', 'Optional remarks (approve)', 'Any note for Instacertify (optional)');
    };
    document.getElementById('btn-changes').onclick = function () {
      openRemarks('changes', 'Revision request', 'What should we change in the quotation?');
    };
    document.getElementById('btn-cancel-remarks').onclick = function () {
      pendingAction = null;
      document.getElementById('remarks-box').style.display = 'none';
    };
    document.getElementById('btn-submit-action').onclick = function () {
      const remarks = document.getElementById('remarks').value || '';
      if (pendingAction === 'changes' && !remarks.trim()) {
        showMsg('Please enter revision remarks.', false);
        return;
      }
      let method = 'instacertify.quotation.events.customer_accept_quotation';
      let body = {token: token, remarks: remarks};
      let okText = 'Quotation approved. Thank you!';
      if (pendingAction === 'changes') {
        method = 'instacertify.quotation.events.customer_request_changes';
        okText = 'Revision request submitted. We will send an updated quote.';
      }
      post(method, body).then((res) => {
        const msg = (res && res.message) ? res.message : okText;
        showMsg(msg, true);
        pendingAction = null;
        load();
      }).catch((e) => showMsg(e.message || 'Request failed', false));
    };
    load();
  </script>
</body>
</html>

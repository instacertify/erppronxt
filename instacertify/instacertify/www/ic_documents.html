<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Documents & Data Collection Sheet</title>
  <link rel="icon" type="image/png" href="/assets/instacertify/images/favicon-32.png"/>
  <link rel="stylesheet" href="/assets/instacertify/css/instacertify.css"/>
  <style>
    .ic-doc-item { border:1.5px solid #9eb8c8; border-radius:10px; padding:14px; margin:12px 0; background:#fff; }
    .ic-doc-item textarea, .ic-data-box input, .ic-data-box textarea {
      width:100%; border-radius:8px; border:1.5px solid #9eb8c8; padding:10px 12px; margin-top:6px;
      box-sizing:border-box; background:#fff; color:#0B1820; font-size:15px; line-height:1.4;
      pointer-events:auto !important; opacity:1 !important; position:relative; z-index:2;
    }
    .ic-doc-item textarea:focus, .ic-data-box input:focus, .ic-data-box textarea:focus {
      outline:2px solid #065175; border-color:#065175;
    }
    .ic-doc-meta { font-size:12px; color:#5a7382; margin-top:4px; }
    .ic-data-box { margin-top:18px; padding:16px; border-radius:12px; background:#F5F9FD; border:1.5px solid #9eb8c8; }
    .ic-data-box label { display:block; font-weight:650; color:#033447; font-size:13px; margin-top:4px; }
    .ic-form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; }
    @media (max-width:720px){ .ic-form-grid { grid-template-columns:1fr; } }
    .ic-msg { margin-top:10px; padding:10px 12px; border-radius:10px; display:none; }
    .ic-msg.ok { display:block; background:#e7f7ee; color:#1b7a45; }
    .ic-msg.err { display:block; background:#fdecea; color:#b42318; }
    .ic-section-title { color:#065175; margin:0 0 10px; }
    .ic-df-row { margin:12px 0; padding:10px 12px; background:#fff; border:1px solid #d5e4ee; border-radius:8px; }
    .ic-empty { padding:14px; border:1.5px dashed #9eb8c8; border-radius:10px; color:#5a7382; background:#fff; }
  </style>
</head>
<body class="ic-portal-body">
  <div class="ic-portal-wrap">
    <div class="ic-portal-brand" style="margin-bottom:14px;">
      <img class="ic-brand-logo" src="/assets/instacertify/images/instacertify_logo.png" alt="Instacertify"/>
    </div>
    <div class="ic-portal-card">
      <h2 style="color:#065175;margin-top:0;">Documents Collection Sheet</h2>
      <div id="content">Loading…</div>
      <div id="msg" class="ic-msg"></div>
      <div class="ic-actions" id="pdf-actions" style="display:none;margin:12px 0;">
        <a class="ic-btn ic-btn-accent" id="btn-pdf" href="#" target="_blank" rel="noopener">Download PDF of filled data</a>
      </div>
      <div id="list"></div>
      <div class="ic-data-box" id="data-box" style="display:none;">
        <h3 class="ic-section-title">Customer Data Sheet</h3>
        <p style="color:#5b7380;font-size:0.92rem;margin-top:0;">Fill company / product details. Saved data is mapped to your Instacertify customer record.</p>
        <div class="ic-form-grid">
          <div><label for="company_legal_name">Company legal name</label><input id="company_legal_name" type="text" autocomplete="organization"/></div>
          <div><label for="gstin">GSTIN</label><input id="gstin" type="text" autocomplete="off"/></div>
          <div><label for="data_contact_person">Contact person</label><input id="data_contact_person" type="text" autocomplete="name"/></div>
          <div><label for="data_contact_phone">Contact phone</label><input id="data_contact_phone" type="tel" autocomplete="tel"/></div>
          <div><label for="data_contact_email">Contact email</label><input id="data_contact_email" type="email" autocomplete="email"/></div>
          <div data-ff="include_product_name"><label for="product_name">Product name</label><input id="product_name" type="text"/></div>
          <div data-ff="include_product_model"><label for="product_model">Model / variant</label><input id="product_model" type="text"/></div>
          <div data-ff="include_product_brand"><label for="product_brand">Brand</label><input id="product_brand" type="text"/></div>
        </div>
        <div data-ff="include_company_address">
          <label for="company_address">Company address</label>
          <textarea id="company_address" rows="2"></textarea>
        </div>
        <div data-ff="include_data_collection_remarks">
          <label for="data_collection_remarks">Remarks</label>
          <textarea id="data_collection_remarks" rows="2"></textarea>
        </div>
        <div id="data-fields" data-ff="include_data_fields"></div>
        <button type="button" class="ic-btn ic-btn-primary" id="btn-data" style="margin-top:12px;">Save customer data sheet</button>
      </div>
    </div>
  </div>
  <script>
    const token = {{ token|tojson }};
    const csrf = {{ csrf_token|tojson }};
    function showMsg(t, ok) {
      const el = document.getElementById('msg');
      el.className = 'ic-msg ' + (ok ? 'ok' : 'err');
      el.textContent = t;
    }
    const ALLOWED_EXT = /\.(pdf|png|jpe?g|webp|gif|bmp|tiff?|xls|xlsx|csv|docx?)$/i;
    function esc(v) {
      const d = document.createElement('div');
      d.textContent = v == null ? '' : String(v);
      return d.innerHTML;
    }
    function assertAllowedFile(file) {
      if (!file || !ALLOWED_EXT.test(file.name || '')) {
        throw new Error('File type not allowed. Use PDF, image, Excel/CSV, or Word.');
      }
    }
    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Could not read file'));
        reader.readAsDataURL(file);
      });
    }
    async function uploadFile(file) {
      assertAllowedFile(file);
      // Prefer guest-safe portal upload API
      try {
        const b64 = await fileToBase64(file);
        const r = await fetch('/api/method/instacertify.documents.api.upload_portal_file', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': csrf},
          body: JSON.stringify({ token, filename: file.name, filedata: b64 })
        });
        const uj = await r.json();
        if (uj.message && uj.message.file_url) return uj.message.file_url;
        if (uj.exc || uj._server_messages) {
          let msg = 'Upload failed';
          try {
            const sm = JSON.parse(uj._server_messages || '[]');
            if (sm[0]) msg = JSON.parse(sm[0]).message || msg;
          } catch (e) {}
          throw new Error(msg);
        }
      } catch (e) {
        // Fallback to core upload_file for logged-in sessions
        const fd = new FormData();
        fd.append('file', file);
        fd.append('is_private', 1);
        const up = await fetch('/api/method/upload_file', {
          method: 'POST', body: fd, headers: {'X-Frappe-CSRF-Token': csrf}
        });
        const uj = await up.json();
        if (!uj.message || !uj.message.file_url) throw (e.message ? e : new Error('Upload failed'));
        return uj.message.file_url;
      }
      throw new Error('Upload failed');
    }
    async function post(method, body) {
      const r = await fetch('/api/method/' + method, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': csrf},
        body: JSON.stringify(body || {})
      });
      const data = await r.json();
      if (data.exc || data._server_messages) {
        let msg = 'Request failed';
        try {
          const sm = JSON.parse(data._server_messages || '[]');
          if (sm[0]) msg = JSON.parse(sm[0]).message || msg;
        } catch (e) {}
        throw new Error(msg);
      }
      return data.message;
    }
    function fill(id, v) { const el = document.getElementById(id); if (el) el.value = v || ''; }
    function load() {
      fetch('/api/method/instacertify.documents.api.get_document_request_by_token?token=' + encodeURIComponent(token))
        .then(r => r.json()).then(r => {
          const d = r.message;
          if (!d) { document.getElementById('content').innerText = 'Not found'; return; }
          document.getElementById('content').innerHTML =
            (d.portal_notice ? ('<p style="color:#5b7380;font-size:0.92rem;">' + esc(d.portal_notice) + '</p>') : '') +
            '<p><b>' + esc(d.title || '') + '</b></p><p>Status: <b>' + esc(d.status || '') + '</b></p>' +
            '<p style="color:#5b7380;font-size:0.92rem;">Allowed uploads: ' + esc(d.allowed_types || 'PDF, images, Excel/CSV, Word') + '</p>' +
            '<h3 class="ic-section-title">List of documents</h3>';
          const pdfBtn = document.getElementById('btn-pdf');
          const pdfWrap = document.getElementById('pdf-actions');
          if (pdfBtn && pdfWrap) {
            pdfBtn.href = d.pdf_url || ('/api/method/instacertify.documents.api.download_collection_pdf?token=' + encodeURIComponent(token));
            pdfWrap.style.display = 'block';
          }
          const list = document.getElementById('list');
          list.innerHTML = '';
          if (!(d.items || []).length) {
            list.innerHTML = '<div class="ic-empty">No document uploads are required on this sheet. Complete the Customer Data Sheet below.</div>';
          }
          (d.items || []).forEach(item => {
            const div = document.createElement('div');
            div.className = 'ic-doc-item';
            div.innerHTML =
              '<b>' + esc(item.document_name || '') + '</b> <span class="ic-badge medium">' + esc(item.status || '') + '</span>' +
              '<div class="ic-doc-meta">' + esc(item.category || '') + (item.is_mandatory ? ' · Mandatory' : '') + ' · Upload file</div>' +
              (item.remark ? '<div class="ic-doc-meta">' + esc(item.remark) + '</div>' : '') +
              (item.review_remarks ? '<div class="ic-doc-meta">Review: ' + esc(item.review_remarks) + '</div>' : '') +
              (item.uploaded_file ? '<div class="ic-doc-meta">File uploaded</div>' : '') +
              '<label class="ic-doc-meta">Your remarks</label>' +
              '<textarea data-remarks="' + esc(item.name) + '" rows="2" placeholder="Remarks for this requirement">' + esc(item.customer_remarks || '') + '</textarea>' +
              '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">' +
              '<button type="button" class="ic-btn ic-btn-ghost" data-save-remarks="' + esc(item.name) + '">Save remarks</button>' +
              '<label class="ic-btn ic-btn-accent" style="cursor:pointer;margin:0;">Upload file<input type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.bmp,.tif,.tiff,.xls,.xlsx,.csv,.doc,.docx,application/pdf,image/*,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" data-item="' + esc(item.name) + '" style="display:none;"/></label>' +
              '</div>';
            list.appendChild(div);
            div.querySelector('[data-save-remarks]').onclick = async () => {
              try {
                const remarks = div.querySelector('[data-remarks]').value || '';
                await post('instacertify.documents.api.save_item_remarks', {token, item_name: item.name, remarks});
                showMsg('Remarks saved.', true);
              } catch (e) { showMsg(e.message, false); }
            };
            div.querySelector('input[type=file]').addEventListener('change', async (e) => {
              const file = e.target.files[0];
              if (!file) return;
              try {
                const remarks = div.querySelector('[data-remarks]').value || '';
                const file_url = await uploadFile(file);
                await post('instacertify.documents.api.upload_document_item', {
                  token, item_name: item.name, file_url, remarks
                });
                showMsg('Uploaded successfully.', true);
                setTimeout(load, 600);
              } catch (err) { showMsg(err.message || 'Upload failed', false); }
            });
          });

          document.getElementById('data-box').style.display = 'block';
          const flags = d.format_fields || {};
          document.querySelectorAll('[data-ff]').forEach(el => {
            const key = el.getAttribute('data-ff');
            const on = flags[key] === undefined || flags[key] === null || Number(flags[key]) === 1;
            el.style.display = on ? '' : 'none';
          });
          ['company_legal_name','gstin','company_address','data_contact_person','data_contact_phone',
           'data_contact_email','product_name','product_model','product_brand','data_collection_remarks'
          ].forEach(k => fill(k, d[k]));
          const df = document.getElementById('data-fields');
          df.innerHTML = '';
          if (flags.include_data_fields === undefined || Number(flags.include_data_fields) === 1) {
            const rows = d.data_fields || [];
            if (!rows.length) {
              df.innerHTML = '<div class="ic-empty" style="margin-top:10px;">No additional fields on this template. Company / contact fields above are still editable.</div>';
            }
            rows.forEach(row => {
              const wrap = document.createElement('div');
              wrap.className = 'ic-df-row';
              wrap.innerHTML =
                '<label>' + esc(row.field_label || '') + (row.is_mandatory ? ' *' : '') + '</label>' +
                (row.help_text ? '<div class="ic-doc-meta">' + esc(row.help_text) + '</div>' : '') +
                '<textarea data-df="' + esc(row.name) + '" rows="3" placeholder="Enter value">' + esc(row.field_value || '') + '</textarea>';
              df.appendChild(wrap);
            });
          }
        }).catch(() => {
          document.getElementById('content').innerText = 'Could not load this sheet. Check the link or ask your coordinator for a new one.';
        });
    }
    document.getElementById('btn-data').onclick = async () => {
      try {
        const data_fields = Array.from(document.querySelectorAll('[data-df]')).map(el => ({
          name: el.getAttribute('data-df'),
          field_value: el.value || ''
        }));
        await post('instacertify.documents.api.save_data_collection', {
          token,
          company_legal_name: document.getElementById('company_legal_name').value,
          gstin: document.getElementById('gstin').value,
          company_address: document.getElementById('company_address').value,
          data_contact_person: document.getElementById('data_contact_person').value,
          data_contact_phone: document.getElementById('data_contact_phone').value,
          data_contact_email: document.getElementById('data_contact_email').value,
          product_name: document.getElementById('product_name').value,
          product_model: document.getElementById('product_model').value,
          product_brand: document.getElementById('product_brand').value,
          data_collection_remarks: document.getElementById('data_collection_remarks').value,
          data_fields: JSON.stringify(data_fields)
        });
        showMsg('Customer data sheet saved.', true);
        setTimeout(load, 600);
      } catch (e) { showMsg(e.message || 'Could not save data collection', false); }
    };
    load();
  </script>
</body>
</html>

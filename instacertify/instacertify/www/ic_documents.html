<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Instacertify Document Request</title>
  <link rel="icon" type="image/png" href="/assets/instacertify/images/favicon-32.png"/>
  <link rel="apple-touch-icon" href="/assets/instacertify/images/apple-touch-icon.png"/>
  <link rel="stylesheet" href="/assets/instacertify/css/instacertify.css"/>
</head>
<body class="ic-portal-body">
  <div class="ic-portal-wrap">
    <div class="ic-portal-brand" style="margin-bottom:14px;">
      <img class="ic-brand-logo" src="/assets/instacertify/images/instacertify_logo.png" alt="Instacertify"/>
    </div>
    <div class="ic-portal-card">
      <h2 style="color:#065175;margin-top:0;">Document Checklist</h2>
      <div id="content">Loading…</div>
      <div id="list"></div>
    </div>
  </div>
  <script>
    const token = {{ token|tojson }};
    fetch('/api/method/instacertify.documents.api.get_document_request_by_token?token=' + encodeURIComponent(token))
      .then(r => r.json()).then(r => {
        const d = r.message;
        if (!d) { document.getElementById('content').innerText = 'Not found'; return; }
        document.getElementById('content').innerHTML = '<p><b>' + d.title + '</b></p><p>Status: ' + d.status + '</p>';
        const list = document.getElementById('list');
        (d.items || []).forEach(item => {
          const div = document.createElement('div');
          div.style.cssText = 'border:1px solid #d7e6ef;border-radius:12px;padding:12px;margin:10px 0;';
          div.innerHTML = '<b>' + item.document_name + '</b> <span class="ic-badge medium">' + item.status + '</span>' +
            '<div style="font-size:12px;color:#667;">' + (item.category || '') + (item.is_mandatory ? ' · Mandatory' : '') + '</div>' +
            (item.uploaded_file ? '<div><a href="' + item.uploaded_file + '" target="_blank">View uploaded file</a></div>' : '') +
            '<input type="file" data-item="' + item.name + '" style="margin-top:8px;"/>';
          list.appendChild(div);
          div.querySelector('input').addEventListener('change', async function (e) {
            const file = e.target.files[0];
            if (!file) return;
            const fd = new FormData();
            fd.append('file', file);
            fd.append('is_private', 0);
            const up = await fetch('/api/method/upload_file', { method: 'POST', body: fd, headers: {'X-Frappe-CSRF-Token': {{ csrf_token|tojson }} }});
            const uj = await up.json();
            const file_url = uj.message.file_url;
            await fetch('/api/method/instacertify.documents.api.upload_document_item', {
              method: 'POST',
              headers: {'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': {{ csrf_token|tojson }}},
              body: JSON.stringify({token: token, item_name: item.name, file_url: file_url})
            });
            alert('Uploaded successfully');
            location.reload();
          });
        });
      });
  </script>
</body>
</html>
